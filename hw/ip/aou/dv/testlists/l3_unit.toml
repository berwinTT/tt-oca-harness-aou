schema_version = 1

# The L3 protocol model and AOU_FDI_CHECKER unit bench (TB=l3_unit, no DUT).
# The bench's aggregate (aou_l3_unit_sim_cfg.toml [testlist]).
# Scenario -> test-plan items: plan_ids.yaml. Scenario names are unique across
# every list all.toml includes; a name carries the plusargs, target or area only
# where the test alone would repeat.

[[tests]]
name = "aou_l3_codec_test"
module = { uvm = "aou_l3_codec_test" }
seed = 1
tags = ["l3_unit"]
run_modes = ["l3_unit"]

[[tests]]
name = "aou_l3_credit_test"
module = { uvm = "aou_l3_credit_test" }
seed = 1
tags = ["l3_unit"]
run_modes = ["l3_unit"]

[[tests]]
name = "aou_l3_crossflit_test"
module = { uvm = "aou_l3_crossflit_test" }
seed = 1
tags = ["l3_unit"]
run_modes = ["l3_unit"]

[[tests]]
name = "aou_l3_dest_rp_test"
module = { uvm = "aou_l3_dest_rp_test" }
seed = 1
tags = ["l3_unit"]
run_modes = ["l3_unit"]

[[tests]]
name = "aou_l3_inject_test"
module = { uvm = "aou_l3_inject_test" }
seed = 1
tags = ["l3_unit"]
run_modes = ["l3_unit"]

# The v0.8 8.4 teardown rules through AOU_FDI_CHECKER: a request after the
# sender's own DeactivateReq (AOU-R30) and a response credit after its own
# DeactivateAck (AOU-R29).
[[tests]]
name = "aou_l3_inject_test.L3_INJECT-req_after_dreq"
module = { uvm = "aou_l3_inject_test" }
seed = 1
tags = ["l3_unit"]
run_modes = ["l3_unit"]
args = ["+L3_INJECT=req_after_dreq"]

[[tests]]
name = "aou_l3_inject_test.L3_INJECT-crd_in_disabled"
module = { uvm = "aou_l3_inject_test" }
seed = 1
tags = ["l3_unit"]
run_modes = ["l3_unit"]
args = ["+L3_INJECT=crd_in_disabled"]

# Credits that cross the final DeactivateAck in both directions: each model
# advertises request credit until it is DISABLED and holds some back to send
# behind its own DeactivateReq. Neither AOU_FDI_CHECKER nor the receiving model
# may report them, and both must have seen them.
[[tests]]
name = "aou_l3_late_adv_test"
module = { uvm = "aou_l3_late_adv_test" }
seed = 1
reseed = 3
tags = ["l3_unit"]
run_modes = ["l3_unit"]

[[tests]]
name = "aou_l3_link_test"
module = { uvm = "aou_l3_link_test" }
seed = 1
tags = ["l3_unit"]
run_modes = ["l3_unit"]

[[tests]]
name = "aou_l3_loopback_test"
module = { uvm = "aou_l3_loopback_test" }
seed = 1
tags = ["l3_unit"]
run_modes = ["l3_unit"]

[[tests]]
name = "aou_l3_unit_env_test"
module = { uvm = "aou_l3_unit_env_test" }
seed = 1
tags = ["l3_unit"]
run_modes = ["l3_unit"]

[[groups]]
name = "l3_unit"
expected_count = 11
tests = [
  "aou_l3_codec_test",
  "aou_l3_credit_test",
  "aou_l3_crossflit_test",
  "aou_l3_dest_rp_test",
  "aou_l3_inject_test",
  "aou_l3_inject_test.L3_INJECT-req_after_dreq",
  "aou_l3_inject_test.L3_INJECT-crd_in_disabled",
  "aou_l3_late_adv_test",
  "aou_l3_link_test",
  "aou_l3_loopback_test",
  "aou_l3_unit_env_test",
]

[[groups]]
